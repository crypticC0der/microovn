name: ovs-doca
summary: Open vSwitch with the DOCA accelerated datapath
vendor: Canonical Ltd
grade: stable
devices:
  allof:
    - type: pci
      vendor-id: "0x15b3"
    - type: kernel-module
      name: mlx5_core
    - type: hugepages
      size: 2M
      num: 4096
    - type: iommu
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64
runtime: ovs-doca
components:
  - ovs-doca
